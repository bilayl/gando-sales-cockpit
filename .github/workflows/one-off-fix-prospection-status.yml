name: One-off prospection status fix

on:
  push:
    paths:
      - '.github/patch-triggers/fix-prospection-status.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix stale statuses and expose status editor everywhere
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{label}: needle not found in {path}')
              p.write_text(text.replace(old, new, 1))

          # 1) Never re-inject the removed legacy company status "À travailler".
          path = 'app/api/companies/[id]/route.ts'
          replace_once(path,
              '  return "À travailler";\n}\n\nfunction companyStatusProperties',
              '  return "À contacter";\n}\n\nfunction companyStatusProperties',
              'company fallback')
          replace_once(path,
              '    "À travailler": { hs_lead_status: "NEW", lifecyclestage: "" },',
              '    "À travailler": { statut_prospection: "À contacter", hs_lead_status: "OPEN", lifecyclestage: "" },',
              'legacy status mapping')
          replace_once(path,
              '    const backfill: Record<string, string> = {};\n',
              '    const backfill: Record<string, string> = {};\n    if (current.statut_prospection === "À travailler") {\n      backfill.statut_prospection = "À contacter";\n      if (current.hs_lead_status === "NEW") backfill.hs_lead_status = "OPEN";\n    }\n',
              'legacy status backfill')
          replace_once(path,
              '    const existingProperties = existing?.raw_data?.properties ?? {};\n\n    if (properties.statut_prospection) {',
              '    const existingProperties = existing?.raw_data?.properties ?? {};\n\n    if (properties.statut_prospection === "À travailler") {\n      properties.statut_prospection = "À contacter";\n    }\n\n    if (properties.statut_prospection) {',
              'PATCH normalization')

          # 2) Ensure contact prospection options are updated on CONTACTS, not COMPANIES.
          path = 'lib/hubspot/qualification-schema.ts'
          replace_once(path,
              '  await ensureExistingPropertyOptions(CONTACT_PROSPECTION_SCHEMA, current);',
              '  await ensureExistingPropertyOptions(CONTACT_PROSPECTION_SCHEMA, current, "contacts");',
              'contact option target')
          replace_once(path,
              '  await ensureExistingPropertyOptions(schema, current);\n}\n\nasync function ensureExistingPropertyOptions(schema: PropertySchema, current: any) {',
              '  await ensureExistingPropertyOptions(schema, current, "companies");\n}\n\nasync function ensureExistingPropertyOptions(schema: PropertySchema, current: any, objectType: "contacts" | "companies") {',
              'helper signature')
          replace_once(path,
              '  await hubspotJson(`/crm/properties/2026-03/companies/${encodeURIComponent(schema.name)}`, {\n    method: "PATCH",\n    body: JSON.stringify({ options: nextOptions }),\n  });',
              '  await hubspotJson(`/crm/properties/2026-03/${objectType}/${encodeURIComponent(schema.name)}`, {\n    method: "PATCH",\n    body: JSON.stringify({ options: nextOptions }),\n  });',
              'helper endpoint')
          # There is one more company schema call later in the file.
          p = Path(path)
          text = p.read_text()
          text = text.replace('await ensureExistingPropertyOptions(schema, current);', 'await ensureExistingPropertyOptions(schema, current, "companies");')
          p.write_text(text)

          # 3) Refresh contact status options when loading qualification metadata.
          path = 'app/api/hubspot/qualification-properties/route.ts'
          replace_once(path,
              'import { ensureCompanyQualificationProperties } from "@/lib/hubspot/qualification-schema";',
              'import { ensureCompanyQualificationProperties, ensureContactProspectionOptions } from "@/lib/hubspot/qualification-schema";',
              'qualification import')
          replace_once(path,
              '    let schema = null;\n    if (kind === "company") schema = await ensureCompanyQualificationProperties();',
              '    let schema = null;\n    if (kind === "company") schema = await ensureCompanyQualificationProperties();\n    else await ensureContactProspectionOptions();',
              'contact metadata ensure')

          # 4) Make the prospection status selector resilient even while metadata is loading/missing.
          path = 'components/qualification-properties.tsx'
          replace_once(path,
              'type Option = { value: string; label: string };\n',
              'type Option = { value: string; label: string };\n\nconst COMPANY_STATUS_OPTIONS: Option[] = ["À contacter", "Tentative", "Contact établi", "À relancer", "Ultérieur", "Démo prévue", "Opportunité", "Gagné", "Pas intéressé", "Perdu"].map(value => ({ value, label: value }));\nconst CONTACT_STATUS_OPTIONS: Option[] = ["À prospecter", "En prospection", "Conversation", "RDV booké", "À recycler", "Non qualifié", "Pas intéressé", "Perdu", "Gagné"].map(value => ({ value, label: value }));\n',
              'status fallback options')
          replace_once(path,
              'function resolveType(kind: Kind, spec: FieldSpec, definition?: PropertyDefinition): FieldType {\n  if (kind === "company" && spec.key === "prospection") return "company-status";',
              'function resolveType(kind: Kind, spec: FieldSpec, definition?: PropertyDefinition): FieldType {\n  if (spec.key === "prospection") return kind === "company" ? "company-status" : "select";',
              'prospection type')
          replace_once(path,
              '  const baseOptions = (definition?.options || []).filter(option => type !== "company-status" || option.value !== "À travailler");',
              '  const metadataOptions = definition?.options || [];\n  const fallbackOptions = spec.key === "prospection" ? (type === "company-status" ? COMPANY_STATUS_OPTIONS : CONTACT_STATUS_OPTIONS) : [];\n  const rawOptions = metadataOptions.length ? metadataOptions : fallbackOptions;\n  const baseOptions = rawOptions.filter(option => type !== "company-status" || option.value !== "À travailler");',
              'status option fallback')
          replace_once(path,
              '            disabled={disabled || definition?.missing}',
              '            disabled={disabled || Boolean(definition?.missing && spec.key !== "prospection")}',
              'status editor availability')

          # 5) Put qualification/status editor on every dedicated CRM page.
          path = 'components/crm-record-page.tsx'
          replace_once(path,
              'import { AllCRMProperties, NewCRMNoteButton } from "@/components/crm-record-tools";\nimport { formatDate, initials } from "@/lib/utils";',
              'import { AllCRMProperties, NewCRMNoteButton } from "@/components/crm-record-tools";\nimport { QualificationProperties } from "@/components/qualification-properties";\nimport { formatDate, initials } from "@/lib/utils";',
              'record page import')
          replace_once(path,
              '                </div></Card>\n\n                <Card className="p-4"><div className="mb-3 flex items-center gap-2 text-xs font-bold uppercase tracking-[0.14em] text-muted-foreground">{kind === "company" ? <Users size={14} /> : <Building2 size={14} />} {kind === "company" ? "Contacts associés" : "Entreprises associées"}</div>',
              '                </div></Card>\n\n                <Card className="p-4"><QualificationProperties kind={kind} properties={{ ...p, __hubspot_id: p.__hubspot_id || recordId }} fallbackProperties={kind === "company" ? (data?.contacts?.[0]?.properties || {}) : {}} /></Card>\n\n                <Card className="p-4"><div className="mb-3 flex items-center gap-2 text-xs font-bold uppercase tracking-[0.14em] text-muted-foreground">{kind === "company" ? <Users size={14} /> : <Building2 size={14} />} {kind === "company" ? "Contacts associés" : "Entreprises associées"}</div>',
              'record page qualification editor')

          PY
          git config user.name gando-bot
          git config user.email gando-bot@users.noreply.github.com
          git add app/api/companies/'[id]'/route.ts lib/hubspot/qualification-schema.ts app/api/hubspot/qualification-properties/route.ts components/qualification-properties.tsx components/crm-record-page.tsx
          git commit -m "fix: normalize prospection status across CRM records"
          git push origin HEAD:main
