name: One-off Rodeeo phone and enrichment fix

on:
  push:
    paths:
      - '.github/patch-triggers/fix-rodeeo-phone-enrichment.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix company phone fallbacks and restore record enrichment
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Segment members: load associated contact phone/mobilephone in one HubSpot batch.
          path = Path('app/api/segments/[listId]/members/route.ts')
          text = path.read_text()

          needle = '''function freshProspectionStatus(properties: Record<string, unknown>) {'''
          if needle not in text:
              raise SystemExit('segment helper insertion point missing')

          # Insert helper before GET, after freshProspectionStatus function by targeting the line immediately before export.
          marker = '''export async function GET(request: NextRequest, { params }: { params: Promise<{ listId: string }> }) {'''
          helper = '''type AssociatedContactPhone = {\n  id: string;\n  phone?: string;\n  name?: string;\n};\n\nasync function associatedContactPhones(companyIds: string[]) {\n  const result = new Map<string, AssociatedContactPhone>();\n  if (!companyIds.length) return result;\n\n  try {\n    const associations = await hubspotJsonWithServiceFallback(`/crm/v3/associations/companies/contacts/batch/read`, {\n      method: "POST",\n      body: JSON.stringify({ inputs: companyIds.map(id => ({ id })) }),\n    });\n\n    const companyToContacts = new Map<string, string[]>();\n    const allContactIds = new Set<string>();\n    for (const association of associations.results ?? []) {\n      const companyId = String(association?.from?.id || association?.from?.objectId || association?.id || "");\n      if (!companyId) continue;\n      const targets = Array.isArray(association?.to) ? association.to : Array.isArray(association?.results) ? association.results : [];\n      const ids = targets.map((target: any) => String(target?.id || target?.toObjectId || target?.objectId || "")).filter(Boolean);\n      companyToContacts.set(companyId, ids);\n      ids.forEach(id => allContactIds.add(id));\n    }\n\n    const contactIds = Array.from(allContactIds);\n    if (!contactIds.length) return result;\n    const contacts = await hubspotJsonWithServiceFallback(`/crm/objects/2026-03/contacts/batch/read`, {\n      method: "POST",\n      body: JSON.stringify({\n        properties: ["firstname", "lastname", "email", "phone", "mobilephone"],\n        inputs: contactIds.map(id => ({ id })),\n      }),\n    });\n    const contactById = new Map((contacts.results ?? []).map((contact: any) => [String(contact.id), contact.properties ?? {}]));\n\n    for (const [companyId, ids] of companyToContacts) {\n      let fallback: AssociatedContactPhone | null = null;\n      for (const contactId of ids) {\n        const properties: any = contactById.get(contactId) || {};\n        const phone = String(properties.phone || properties.mobilephone || "").trim();\n        const name = [properties.firstname, properties.lastname].filter(Boolean).join(" ") || properties.email || undefined;\n        const candidate = { id: contactId, phone: phone || undefined, name };\n        if (!fallback) fallback = candidate;\n        if (phone) { fallback = candidate; break; }\n      }\n      if (fallback) result.set(companyId, fallback);\n    }\n  } catch (error) {\n    console.error("HubSpot associated contact phone batch:", error);\n  }\n\n  return result;\n}\n\n'''
          if marker not in text:
              raise SystemExit('segment GET marker missing')
          text = text.replace(marker, helper + marker, 1)

          old = '''    const freshById = new Map((fresh.results ?? []).map((r: any) => [String(r.id), r.properties ?? {}]));\n\n    if (objectTypeId === "0-2") {'''
          new = '''    const freshById = new Map((fresh.results ?? []).map((r: any) => [String(r.id), r.properties ?? {}]));\n    const associatedPhones = objectTypeId === "0-2" ? await associatedContactPhones(ids) : new Map<string, AssociatedContactPhone>();\n\n    if (objectTypeId === "0-2") {'''
          if old not in text:
              raise SystemExit('segment freshById needle missing')
          text = text.replace(old, new, 1)

          old = '''        const localQualification = qualificationProperties(local);\n        const freshStatus = freshProspectionStatus(freshProperties);\n        return {\n          id,\n          properties: {'''
          new = '''        const localQualification = qualificationProperties(local);\n        const freshStatus = freshProspectionStatus(freshProperties);\n        const associatedContact = associatedPhones.get(id);\n        const companyPhone = String(freshProperties.phone || local?.raw_data?.properties?.phone || "").trim();\n        const effectivePhone = companyPhone || associatedContact?.phone || "";\n        return {\n          id,\n          properties: {'''
          if old not in text:
              raise SystemExit('segment company result needle missing')
          text = text.replace(old, new, 1)

          old = '''            ...freshProperties,\n            qualification_status: freshStatus || localQualification.qualification_status,'''
          new = '''            ...freshProperties,\n            phone: effectivePhone || undefined,\n            associated_contact_phone: associatedContact?.phone,\n            associated_contact_name: associatedContact?.name,\n            phone_source: companyPhone ? "company" : associatedContact?.phone ? "associated_contact" : undefined,\n            qualification_status: freshStatus || localQualification.qualification_status,'''
          if old not in text:
              raise SystemExit('segment properties needle missing')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 2) Full CRM record page: restore enrichment and use associated contact mobile as phone fallback.
          path = Path('components/crm-record-page.tsx')
          text = path.read_text()

          old = '''import { EditableCRMTaskCard } from "@/components/editable-crm-task-card";\nimport { AllCRMProperties, NewCRMNoteButton } from "@/components/crm-record-tools";'''
          new = '''import { EditableCRMTaskCard } from "@/components/editable-crm-task-card";\nimport { ProfileSourcingButton } from "@/components/profile-sourcing-button";\nimport { AllCRMProperties, NewCRMNoteButton } from "@/components/crm-record-tools";'''
          if old not in text:
              raise SystemExit('crm import needle missing')
          text = text.replace(old, new, 1)

          old = '''  const linkedRecords = useMemo(() => kind === "company" ? data?.contacts || [] : data?.companies || [], [data, kind]);\n\n  return ('''
          new = '''  const linkedRecords = useMemo(() => kind === "company" ? data?.contacts || [] : data?.companies || [], [data, kind]);\n  const associatedPhoneRecord = kind === "company"\n    ? linkedRecords.find((item: any) => item?.properties?.phone || item?.properties?.mobilephone)\n    : null;\n  const associatedPhone = associatedPhoneRecord?.properties?.phone || associatedPhoneRecord?.properties?.mobilephone || "";\n  const effectivePhone = p.phone || p.mobilephone || associatedPhone;\n  const phoneLabel = p.phone || p.mobilephone ? "Téléphone" : associatedPhone ? "Téléphone contact associé" : "Téléphone";\n\n  return ('''
          if old not in text:
              raise SystemExit('crm linked records needle missing')
          text = text.replace(old, new, 1)

          old = '''<div className="flex flex-wrap gap-2"><NewCRMNoteButton kind={kind} recordId={recordId} onCreated={async () => { setTab("notes"); await load(); }} />{p.phone || p.mobilephone ? <Button asChild><a href={`tel:${p.phone || p.mobilephone}`}><Phone size={14} /> Appeler</a></Button> : null}'''
          new = '''<div className="flex flex-wrap gap-2"><NewCRMNoteButton kind={kind} recordId={recordId} onCreated={async () => { setTab("notes"); await load(); }} /><ProfileSourcingButton entityType={kind} entityId={recordId} onCompleted={load} label="Enrichir cette fiche" />{effectivePhone ? <Button asChild><a href={`tel:${effectivePhone}`}><Phone size={14} /> Appeler</a></Button> : null}'''
          if old not in text:
              raise SystemExit('crm actions needle missing')
          text = text.replace(old, new, 1)

          old = '''<Info icon={Phone} label="Téléphone" value={p.phone || p.mobilephone} />'''
          new = '''<Info icon={Phone} label={phoneLabel} value={effectivePhone} />'''
          if old not in text:
              raise SystemExit('crm phone info needle missing')
          text = text.replace(old, new, 1)

          old = '''<div className="mt-1 truncate text-xs text-muted-foreground">{kind === "company" ? lp.jobtitle || lp.email : lp.domain || lp.city}</div>'''
          new = '''<div className="mt-1 truncate text-xs text-muted-foreground">{kind === "company" ? lp.phone || lp.mobilephone || lp.jobtitle || lp.email : lp.domain || lp.city}</div>'''
          if old not in text:
              raise SystemExit('crm linked record subtitle needle missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git config user.name gando-bot
          git config user.email gando-bot@users.noreply.github.com
          git add 'app/api/segments/[listId]/members/route.ts' components/crm-record-page.tsx
          git commit -m "fix: surface associated phones and restore record enrichment"
          git push origin HEAD:main
