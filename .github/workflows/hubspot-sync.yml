name: HubSpot Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hubspot-sync.yml'
      - 'app/api/sync/route.ts'
      - 'lib/github-actions-oidc.ts'

permissions:
  contents: read
  id-token: write

concurrency:
  group: hubspot-sync
  cancel-in-progress: false

env:
  SYNC_URL: https://gando-sales-cockpit-web.vercel.app/api/sync
  OIDC_AUDIENCE: gando-sales-cockpit-hubspot-sync

jobs:
  sync-primary:
    name: Sync ${{ matrix.resource }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        resource: [companies, contacts, deals, tasks, activities]
    steps:
      - name: Sync ${{ matrix.resource }}
        run: |
          oidc_token=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
            | jq -r '.value // empty')
          if [ -z "$oidc_token" ]; then
            echo "Unable to obtain GitHub Actions OIDC token"
            exit 1
          fi
          echo "::add-mask::$oidc_token"

          body=$(mktemp)
          code=$(curl -sS --max-time 300 -o "$body" -w "%{http_code}" \
            -H "Authorization: Bearer $oidc_token" \
            "$SYNC_URL?resource=${{ matrix.resource }}")
          echo "HTTP $code"
          cat "$body"
          rm "$body"
          if [ "$code" != "200" ]; then
            exit 1
          fi

  refresh-derived:
    name: Refresh associations and recommendations
    runs-on: ubuntu-latest
    needs: sync-primary
    steps:
      - name: Refresh derived sales data once
        run: |
          oidc_token=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
            | jq -r '.value // empty')
          if [ -z "$oidc_token" ]; then
            echo "Unable to obtain GitHub Actions OIDC token"
            exit 1
          fi
          echo "::add-mask::$oidc_token"

          body=$(mktemp)
          code=$(curl -sS --max-time 300 -o "$body" -w "%{http_code}" \
            -H "Authorization: Bearer $oidc_token" \
            "$SYNC_URL?resource=qualification")
          echo "HTTP $code"
          cat "$body"
          rm "$body"
          if [ "$code" != "200" ]; then
            exit 1
          fi
