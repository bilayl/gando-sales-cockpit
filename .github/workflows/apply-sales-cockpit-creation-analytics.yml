name: Apply Sales Cockpit creation and analytics fixes

on:
  push:
    branches:
      - feat/sales-cockpit-creation-analytics

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'gando-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply requested changes
        run: python scripts/apply_sales_cockpit_creation_analytics.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "gando-ci"
          git config user.email "gando-ci@users.noreply.github.com"
          git add app components
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: fix analytics and add cockpit record creation"
          git push
