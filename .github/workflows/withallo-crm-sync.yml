name: Allo CRM Sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: allo-crm-sync
  cancel-in-progress: false

env:
  SYNC_URL: https://gando-sales-cockpit-web.vercel.app/api/withallo/crm-sync
  OIDC_AUDIENCE: gando-sales-cockpit-hubspot-sync

jobs:
  sync-crm:
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize CRM companies and contacts to Allo
        run: |
          oidc_token=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
            | jq -r '.value // empty')
          if [ -z "$oidc_token" ]; then
            echo "Unable to obtain GitHub Actions OIDC token"
            exit 1
          fi
          echo "::add-mask::$oidc_token"

          body=$(mktemp)
          code=$(curl -sS --max-time 300 -o "$body" -w "%{http_code}" \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            -d '{"limit":40}' \
            "$SYNC_URL")
          echo "HTTP $code"
          cat "$body"
          rm "$body"
          if [ "$code" != "200" ]; then
            exit 1
          fi
