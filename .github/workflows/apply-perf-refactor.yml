name: Apply cockpit performance refactor

on:
  push:
    branches: [perf/cockpit-state-management]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[perf-refactor-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cockpit-state-management
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-perf-refactor.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/today-dialer-view.tsx components/prospection-view.tsx lib/call-recommendations.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "perf: reduce cockpit latency and stabilize state [perf-refactor-applied]"
            git push origin HEAD:perf/cockpit-state-management
          fi
