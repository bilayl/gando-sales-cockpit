name: Production sourcing smoke test

# Live production smoke test for the public registry sourcing fallback.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-sourcing-smoke.yml'

permissions:
  contents: read
  statuses: write

jobs:
  live-sourcing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark production sourcing test pending
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"pending","context":"Production Sourcing","description":"Live sourcing test running"}' >/dev/null

      - name: Call production sourcing endpoint
        run: |
          set +e
          HTTP_CODE=$(curl -sS --max-time 120 \
            -o response.json \
            -w '%{http_code}' \
            -X POST 'https://gando-sales-cockpit-web.vercel.app/api/enrichment/search' \
            -H 'content-type: application/json' \
            --data '{"query":"loueurs indépendants de voitures à Lyon","territories":["France métropolitaine"],"sources":["Google","sites web de loueurs","annuaires professionnels"],"limit":3,"minConfidence":0.6}')
          CURL_EXIT=$?
          set -e

          echo "HTTP $HTTP_CODE"
          if [ -f response.json ]; then
            cat response.json
            echo
          fi

          STATE=failure
          DESCRIPTION="Production sourcing failed"

          if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            NEW_PROSPECTS=$(jq -r '.newProspects // 0' response.json)
            PROSPECT_COUNT=$(jq -r '(.prospects // []) | length' response.json)
            FIRST_COMPANY=$(jq -r '(.prospects // [])[0].companyName // ""' response.json)

            echo "newProspects=$NEW_PROSPECTS"
            echo "prospectCount=$PROSPECT_COUNT"
            echo "firstCompany=$FIRST_COMPANY"

            if [ "$PROSPECT_COUNT" -ge 1 ] && [ -n "$FIRST_COMPANY" ]; then
              STATE=success
              DESCRIPTION="$PROSPECT_COUNT prospect(s); first: $FIRST_COMPANY"
            else
              DESCRIPTION="HTTP $HTTP_CODE but no companies returned"
            fi
          else
            ERROR_TEXT=$(jq -r '.error // .message // empty' response.json 2>/dev/null | head -c 70 || true)
            DESCRIPTION="HTTP $HTTP_CODE${ERROR_TEXT:+: $ERROR_TEXT}"
          fi

          DESCRIPTION=$(printf '%s' "$DESCRIPTION" | tr '\n' ' ' | head -c 80)
          CONTEXT=$(printf 'Production Sourcing | %s' "$DESCRIPTION" | head -c 100)
          STATUS_BODY=$(jq -n \
            --arg state "$STATE" \
            --arg context "$CONTEXT" \
            --arg description "$DESCRIPTION" \
            '{state:$state,context:$context,description:$description}')

          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$STATUS_BODY" >/dev/null

          if [ "$STATE" != "success" ]; then
            exit 1
          fi
