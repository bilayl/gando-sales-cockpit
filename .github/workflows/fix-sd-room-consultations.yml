name: Fix SD room consultations

on:
  push:
    branches:
      - fix/sd-room-consultations-contract-table

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'gando-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply requested fixes
        run: python scripts/fix_sd_room_consultations.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "gando-ci"
          git config user.email "gando-ci@users.noreply.github.com"
          git add components lib
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: move consultation detail and simplify public SD05"
          git push
