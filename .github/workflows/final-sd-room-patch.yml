name: Final SD room patch

on:
  push:
    branches:
      - feat/sd05-contract-room-polish
    paths:
      - scripts/final_sd_room_patch.py
      - .github/workflows/final-sd-room-patch.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sd05-contract-room-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final patch
        run: python scripts/final_sd_room_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit validated changes
        run: |
          git config user.name "gando-ci"
          git config user.email "gando-ci@users.noreply.github.com"
          git add components
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: finish SD room UX polish"
          git push origin HEAD:feat/sd05-contract-room-polish
