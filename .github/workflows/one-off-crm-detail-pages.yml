name: One-off CRM detail pages patch

on:
  push:
    paths:
      - '.github/patch-triggers/crm-detail-pages.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply CRM detail navigation patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/company-first-prospection-view.tsx')
          s = path.read_text()
          s = s.replace('import { useEffect, useMemo, useState } from "react";\n', 'import { useEffect, useMemo, useState } from "react";\nimport { useRouter } from "next/navigation";\n')
          s = s.replace('import { CompanyDrawer } from "@/components/company-drawer";\n', '')
          s = s.replace('export function CompanyFirstProspectionView() {\n', 'export function CompanyFirstProspectionView() {\n  const router = useRouter();\n')
          s = s.replace('  const [drawerId, setDrawerId] = useState<string | null>(null);\n', '')
          s = s.replace('onOpen={setDrawerId}', 'onOpen={id => router.push(`/companies/${id}`)}')
          s = s.replace('onOpenCompany={setDrawerId}', 'onOpenCompany={id => router.push(`/companies/${id}`)}')
          s = s.replace('onClick={() => setDrawerId(company.id)}', 'onClick={() => router.push(`/companies/${company.id}`)}')
          s = s.replace('      <CompanyDrawer companyId={drawerId} open={Boolean(drawerId)} onOpenChange={open => !open && setDrawerId(null)} />\n', '')
          path.write_text(s)

          path = Path('components/contact-first-prospection-view.tsx')
          s = path.read_text()
          s = s.replace('import { useEffect, useMemo, useState } from "react";\n', 'import { useEffect, useMemo, useState } from "react";\nimport { useRouter } from "next/navigation";\n')
          s = s.replace('import { ContactDrawer } from "@/components/contact-drawer";\n', '')
          s = s.replace('export function ContactFirstProspectionView() {\n', 'export function ContactFirstProspectionView() {\n  const router = useRouter();\n')
          s = s.replace('  const [drawerId, setDrawerId] = useState<string | null>(null);\n', '')
          s = s.replace('onOpenContact={setDrawerId}', 'onOpenContact={id => router.push(`/contacts/${id}`)}')
          s = s.replace('onClick={() => setDrawerId(contact.id)}', 'onClick={() => router.push(`/contacts/${contact.id}`)}')
          s = s.replace('      <ContactDrawer contactId={drawerId} open={Boolean(drawerId)} onOpenChange={open => !open && setDrawerId(null)} onUpdated={() => void load(true, isRecommendationSegment)} />\n', '')
          s = s.replace('const PROSPECTION_OPTIONS = ["À prospecter", "En prospection", "Conversation", "RDV booké", "À recycler", "Non qualifié", "Perdu"];', 'const PROSPECTION_OPTIONS = ["À prospecter", "En prospection", "Conversation", "RDV booké", "À recycler", "Non qualifié", "Pas intéressé", "Perdu"];')
          path.write_text(s)

          path = Path('components/company-drawer-base.tsx')
          s = path.read_text()
          s = s.replace('{timeline.slice(0, 60).map((item: any) => (', '{timeline.map((item: any) => (')
          s = s.replace('className="mt-2 line-clamp-4 text-xs leading-5 text-muted-foreground"', 'className="mt-2 whitespace-pre-wrap break-words text-xs leading-5 text-muted-foreground"')
          path.write_text(s)

          path = Path('components/contact-drawer-base.tsx')
          s = path.read_text().replace('const [showAllNotes, setShowAllNotes] = useState(false);', 'const [showAllNotes, setShowAllNotes] = useState(true);')
          path.write_text(s)
          PY
          git config user.name "gando-bot"
          git config user.email "bot@gando.app"
          git add components/company-first-prospection-view.tsx components/contact-first-prospection-view.tsx components/company-drawer-base.tsx components/contact-drawer-base.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: use full pages for CRM records"
          git push origin HEAD:main
