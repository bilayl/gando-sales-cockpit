name: One-off CRM task editing patch

on:
  push:
    paths:
      - '.github/patch-triggers/task-edit-crm.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire editable task component
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/crm-record-page.tsx')
          text = path.read_text()
          import_anchor = 'import { Card } from "@/components/ui/card";\n'
          import_line = 'import { EditableCRMTaskCard } from "@/components/editable-crm-task-card";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          old = '<TaskCard key={activity.id} task={activity} owners={owners} />'
          new = '<EditableCRMTaskCard key={activity.id} task={activity} ownerName={ownerLabel(owners, activity.properties?.hubspot_owner_id)} onUpdated={load} />'
          if old not in text and new not in text:
              raise SystemExit('task render not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "gando-bot"
          git config user.email "bot@gando.app"
          git add components/crm-record-page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: enable task actions in CRM detail pages"
          git push origin HEAD:main
