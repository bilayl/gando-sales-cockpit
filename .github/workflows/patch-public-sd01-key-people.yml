name: Patch public SD01 key people

on:
  push:
    branches:
      - feat/sd01-key-people-team-roles
    paths:
      - scripts/patch_public_sd01_key_people.py
      - .github/workflows/patch-public-sd01-key-people.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sd01-key-people-team-roles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch public SD01
        run: python scripts/patch_public_sd01_key_people.py
      - run: npm ci
      - run: npm run build
      - name: Commit validated public Room change
        run: |
          git config user.name "gando-ci"
          git config user.email "gando-ci@users.noreply.github.com"
          git add components/public-sd-room-v6.tsx
          if git diff --cached --quiet; then
            echo "No generated change"
            exit 0
          fi
          git commit -m "feat: show key people in public SD01"
          git push origin HEAD:feat/sd01-key-people-team-roles
