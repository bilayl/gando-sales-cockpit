name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply pending SD editor fixes
        if: github.event_name == 'push'
        run: |
          if grep -q "function ContractTextEditor" components/sd05-contract-builder.tsx; then
            echo "SD editor fixes already applied"
          else
            python scripts/apply_editor_heading_fix.py
          fi
      - run: npm ci
      - run: npm run build
      - name: Commit validated generated changes
        if: github.event_name == 'push'
        run: |
          git config user.name "gando-ci"
          git config user.email "gando-ci@users.noreply.github.com"
          git add components
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: improve SD05 title hierarchy and remove SD01 stage cards"
          git push origin HEAD:main
