name: Install shadcn KPI primitives

on:
  push:
    branches: [refactor/kpi-shadcn-dashboard-v2]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/kpi-shadcn-dashboard-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install official shadcn components in KPI namespace
        env:
          npm_config_legacy_peer_deps: "true"
        run: |
          cp components.json /tmp/components.json
          node <<'NODE'
          const fs = require('fs')
          const config = JSON.parse(fs.readFileSync('components.json', 'utf8'))
          config.aliases = {
            ...config.aliases,
            components: '@/components/kpi-shadcn',
            ui: '@/components/kpi-shadcn/ui',
            hooks: '@/components/kpi-shadcn/hooks'
          }
          fs.writeFileSync('components.json', JSON.stringify(config, null, 2) + '\n')
          NODE
          rm -rf components/kpi-shadcn
          npx shadcn@latest add sidebar chart tabs progress card badge button table select separator skeleton sheet tooltip input --yes --overwrite
          cp /tmp/components.json components.json
      - name: Commit generated shadcn files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Install official shadcn KPI component kit"
          git push origin HEAD:refactor/kpi-shadcn-dashboard-v2
