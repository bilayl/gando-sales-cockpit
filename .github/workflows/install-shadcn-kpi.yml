name: Install shadcn KPI primitives

on:
  push:
    branches: [refactor/kpi-shadcn-dashboard-v2]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/kpi-shadcn-dashboard-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install official shadcn components
        env:
          npm_config_legacy_peer_deps: "true"
        run: |
          rm -f components/ui/sidebar.tsx
          npx shadcn@latest add sidebar chart tabs progress --yes
      - name: Commit generated shadcn files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components.json package.json package-lock.json components/ui hooks || true
          git diff --cached --quiet && exit 0
          git commit -m "Install official shadcn KPI primitives"
          git push origin HEAD:refactor/kpi-shadcn-dashboard-v2
