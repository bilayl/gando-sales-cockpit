name: Apply contact-company association drawer changes

on:
  push:
    branches:
      - feat/contact-company-associations

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'gando-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply drawer changes
        run: python scripts/apply_contact_company_associations.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit application changes
        run: |
          git config user.name "gando-ci"
          git config user.email "gando-ci@users.noreply.github.com"
          git add components/contact-drawer.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: associate companies from contact sheet"
          git push
