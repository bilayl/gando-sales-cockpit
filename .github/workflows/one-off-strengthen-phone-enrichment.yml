name: One-off strengthen phone enrichment

on:
  push:
    paths:
      - '.github/patch-triggers/strengthen-phone-enrichment.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Strengthen website and phone enrichment
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) company-website route: if HubSpot/associated contacts have no website,
          # actively search Google Places via Apify and persist website/domain/phone.
          path = Path('app/api/enrichment/company-website/route.ts')
          text = path.read_text()
          old = 'import { apiError, hubspotJson } from "@/lib/hubspot";\n'
          new = 'import { apiError, hubspotJson } from "@/lib/hubspot";\nimport { searchRentalCompaniesWithApifyDirect } from "@/lib/apify-direct";\n'
          if old not in text:
              raise SystemExit('company website import marker missing')
          text = text.replace(old, new, 1)

          old = '''async function readAssociatedContactWebsite(company: any) {'''
          helper = '''function scoreProspect(prospect: any, companyName: string, city: string) {\n  const normalize = (value = "") => value.toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g, "").replace(/[^a-z0-9]/g, "");\n  const a = normalize(companyName);\n  const b = normalize(prospect?.companyName || prospect?.legalName || "");\n  let score = 0;\n  if (a && b && a === b) score += 120;\n  else if (a && b && (a.includes(b) || b.includes(a))) score += 80;\n  if (city && normalize(city) === normalize(prospect?.city || "")) score += 25;\n  if (prospect?.website) score += 20;\n  if (prospect?.phone) score += 15;\n  return score;\n}\n\nasync function searchPublicCompanyWebsite(companyName: string, city: string, country: string) {\n  if (!companyName) return null;\n  try {\n    const result = await searchRentalCompaniesWithApifyDirect({\n      query: companyName,\n      territories: [[city, country].filter(Boolean).join(", ") || "France"],\n      limit: 8,\n      apifyLimit: 80,\n      apifyContactsPerCompany: 3,\n      apifyPollWaitSeconds: 12,\n    });\n    const ranked = (result.prospects || [])\n      .map(prospect => ({ prospect, score: scoreProspect(prospect, companyName, city) }))\n      .sort((a, b) => b.score - a.score);\n    return ranked[0]?.score >= 80 ? ranked[0].prospect : null;\n  } catch (error) {\n    console.error("Company website discovery via Apify:", error);\n    return null;\n  }\n}\n\n'''
          if old not in text:
              raise SystemExit('company website helper marker missing')
          text = text.replace(old, helper + old, 1)

          old = '''      `/crm/v3/objects/companies/${encodeURIComponent(companyId)}?properties=name,domain,website&associations=contacts`,'''
          new = '''      `/crm/v3/objects/companies/${encodeURIComponent(companyId)}?properties=name,domain,website,phone,city,country&associations=contacts`,'''
          if old not in text:
              raise SystemExit('company website properties marker missing')
          text = text.replace(old, new, 1)

          old = '''    if (!website) {\n      const associated = await readAssociatedContactWebsite(company);\n      website = associated.website;\n      domain = domain || associated.domain;\n      source = associated.source;\n    }\n\n    const patch: Record<string, string> = {};\n    if (!clean(properties.website) && website) patch.website = website;\n    if (!clean(properties.domain) && domain) patch.domain = domain;'''
          new = '''    if (!website) {\n      const associated = await readAssociatedContactWebsite(company);\n      website = associated.website;\n      domain = domain || associated.domain;\n      source = associated.source;\n    }\n\n    let discoveredPhone = "";\n    if (!website || !clean(properties.phone)) {\n      const prospect = await searchPublicCompanyWebsite(clean(properties.name), clean(properties.city), clean(properties.country) || "France");\n      const searchedWebsite = normalizeWebsite(prospect?.website || "");\n      if (!website && searchedWebsite) {\n        website = searchedWebsite;\n        domain = domain || normalizeDomain(searchedWebsite);\n        source = "apify_google_places";\n      }\n      discoveredPhone = clean(prospect?.phone);\n    }\n\n    const patch: Record<string, string> = {};\n    if (!clean(properties.website) && website) patch.website = website;\n    if (!clean(properties.domain) && domain) patch.domain = domain;\n    if (!clean(properties.phone) && discoveredPhone) patch.phone = discoveredPhone;'''
          if old not in text:
              raise SystemExit('company website patch marker missing')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 2) Profile enrichment: if the initial company has no URL, crawl the URL found by
          # Apify in a second pass before deciding that no phone exists.
          path = Path('app/api/enrichment/profile/route.ts')
          text = path.read_text()
          old = '''    const [backend, websiteDiscovery] = await Promise.all([\n      callTargetBackend({\n        companyName,\n        domain,\n        website,\n        phone: cp.phone,\n        city,\n        country,\n        contactName,\n        apifyContactsPerCompany: 5,\n        apifyLimit: 100,\n        apifyRunRefs: Array.isArray(input.apifyRunRefs) ? input.apifyRunRefs : undefined,\n        waitSeconds: Number(input.waitSeconds) || 0,\n      }),\n      discoverPublicWebsiteContacts({ website, domain, contactName }),\n    ]);\n\n    const websiteHasUsefulData = Boolean(websiteDiscovery.phone || websiteDiscovery.email || websiteDiscovery.contactPhone || websiteDiscovery.contactEmail);'''
          new = '''    const [backend, initialWebsiteDiscovery] = await Promise.all([\n      callTargetBackend({\n        companyName,\n        domain,\n        website,\n        phone: cp.phone,\n        city,\n        country,\n        contactName,\n        apifyContactsPerCompany: 5,\n        apifyLimit: 100,\n        apifyRunRefs: Array.isArray(input.apifyRunRefs) ? input.apifyRunRefs : undefined,\n        waitSeconds: Number(input.waitSeconds) || 0,\n      }),\n      discoverPublicWebsiteContacts({ website, domain, contactName }),\n    ]);\n\n    let websiteDiscovery = initialWebsiteDiscovery;\n    const discoveredWebsite = backend.prospect?.website || backend.prospect?.domain || "";\n    const initialHost = normalizeDomain(initialWebsiteDiscovery.website || website || domain || "");\n    const discoveredHost = normalizeDomain(discoveredWebsite);\n    if (discoveredWebsite && discoveredHost && discoveredHost !== initialHost && !initialWebsiteDiscovery.phone) {\n      const secondPass = await discoverPublicWebsiteContacts({\n        website: backend.prospect?.website || undefined,\n        domain: backend.prospect?.domain || undefined,\n        contactName,\n      });\n      websiteDiscovery = {\n        website: secondPass.website || initialWebsiteDiscovery.website,\n        phone: secondPass.phone || initialWebsiteDiscovery.phone,\n        email: secondPass.email || initialWebsiteDiscovery.email,\n        contactPhone: secondPass.contactPhone || initialWebsiteDiscovery.contactPhone,\n        contactEmail: secondPass.contactEmail || initialWebsiteDiscovery.contactEmail,\n        pagesVisited: [...new Set([...(initialWebsiteDiscovery.pagesVisited || []), ...(secondPass.pagesVisited || [])])],\n        errors: [...new Set([...(initialWebsiteDiscovery.errors || []), ...(secondPass.errors || [])])],\n      };\n    }\n\n    const websiteHasUsefulData = Boolean(websiteDiscovery.phone || websiteDiscovery.email || websiteDiscovery.contactPhone || websiteDiscovery.contactEmail);'''
          if old not in text:
              raise SystemExit('profile discovery block marker missing')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 3) Website crawler: include booking/reservation pages, including a small number
          # of external booking links explicitly linked from the official website.
          path = Path('lib/website-contact-discovery.ts')
          text = path.read_text()
          old = '''  "/mentions-legales",\n];'''
          new = '''  "/mentions-legales",\n  "/reservation",\n  "/reservations",\n  "/reserver",\n  "/booking",\n  "/book",\n];'''
          if old not in text:
              raise SystemExit('contact paths marker missing')
          text = text.replace(old, new, 1)

          old = '''  const pathLooksContact = /contact|equipe|team|about|a-propos|mentions/i.test(url.pathname);'''
          new = '''  const pathLooksContact = /contact|equipe|team|about|a-propos|mentions|reservation|reserver|booking|book/i.test(url.pathname);'''
          if old not in text:
              raise SystemExit('path score marker missing')
          text = text.replace(old, new, 1)

          old = '''function discoverContactLinks(base: URL, html: string) {\n  const links: URL[] = [];\n  for (const match of html.matchAll(/href\\s*=\\s*["']([^"'#]+)["']/gi)) {\n    try {\n      const url = new URL(decodeHtml(match[1]), base);\n      if (!/^https?:$/.test(url.protocol) || url.hostname !== base.hostname) continue;\n      if (!/contact|contactez|nous-contacter|equipe|team|about|a-propos|mentions|agence|staff/i.test(url.pathname)) continue;\n      url.hash = "";\n      links.push(url);\n    } catch {}\n  }\n  return links;\n}'''
          new = '''function discoverContactLinks(base: URL, html: string) {\n  const links: URL[] = [];\n  for (const match of html.matchAll(/href\\s*=\\s*["']([^"'#]+)["']/gi)) {\n    try {\n      const url = new URL(decodeHtml(match[1]), base);\n      if (!/^https?:$/.test(url.protocol)) continue;\n      const usefulPath = /contact|contactez|nous-contacter|equipe|team|about|a-propos|mentions|agence|staff|reservation|reservations|reserver|booking|book/i.test(`${url.pathname}${url.search}`);\n      if (!usefulPath) continue;\n      const sameHost = url.hostname === base.hostname;\n      const bookingLink = /reservation|reserver|booking|book/i.test(`${url.hostname}${url.pathname}${url.search}`);\n      if (!sameHost && !bookingLink) continue;\n      url.hash = "";\n      links.push(url);\n    } catch {}\n  }\n  return links;\n}'''
          if old not in text:
              raise SystemExit('discover links marker missing')
          text = text.replace(old, new, 1)

          old = '''    .filter(url => url.toString() !== home!.url.toString())\n    .slice(0, 4);'''
          new = '''    .filter(url => url.toString() !== home!.url.toString())\n    .slice(0, 6);'''
          if old not in text:
              raise SystemExit('page limit marker missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git config user.name gando-bot
          git config user.email gando-bot@users.noreply.github.com
          git add app/api/enrichment/company-website/route.ts app/api/enrichment/profile/route.ts lib/website-contact-discovery.ts
          git commit -m "feat: actively discover booking sites and phone numbers"
          git push origin HEAD:main
