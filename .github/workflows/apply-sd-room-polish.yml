name: Apply SD room polish

on:
  push:
    branches:
      - feat/sd05-contract-room-polish
    paths:
      - scripts/apply_sd_room_polish.py
      - .github/workflows/apply-sd-room-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sd05-contract-room-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply code changes
        run: python scripts/apply_sd_room_polish.py
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Commit generated changes
        run: |
          git config user.name "gando-ci"
          git config user.email "gando-ci@users.noreply.github.com"
          git add app components lib
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: polish SD contract room and document UX"
          git push origin HEAD:feat/sd05-contract-room-polish
